name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: microservice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d microservice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Se usa la última revisión de 1.27 para incorporar los parches de
          # seguridad de la librería estándar detectados por govulncheck.
          go-version: '1.27.x'
          cache: true

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 \
            -path=/migrations \
            -database "postgres://postgres:postgres@localhost:5432/microservice?sslmode=disable" \
            up

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Los siguientes archivos no están formateados con gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Scan for leaked secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact -v

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan dependencies for vulnerabilities
        run: govulncheck ./...

      - name: Test
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee /tmp/test.log

      - name: Report test failures
        if: failure()
        run: |
          if [ -f /tmp/test.log ]; then
            grep -E '^(--- FAIL|FAIL|[[:space:]]+.*\.go:[0-9]+:)' /tmp/test.log | head -50 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Service logs on failure
        if: failure()
        run: |
          docker logs "${{ job.services.postgres.id }}" --tail 100 || true
          docker logs "${{ job.services.rabbitmq.id }}" --tail 100 || true
