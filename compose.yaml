services:
  db:
    image: postgres:15-alpine
    container_name: eventflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microservice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventflow-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: eventflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventflow-network

  # Aplica las migraciones versionadas antes de arrancar API y worker.
  # Las migraciones son idempotentes, por lo que también funcionan sobre bases
  # creadas previamente con docker-entrypoint-initdb.d.
  migrate:
    image: migrate/migrate:v4.18.3
    container_name: eventflow-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:${DB_PASSWORD:-postgres}@db:5432/microservice?sslmode=disable"
      - "up"
    networks:
      - eventflow-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventflow-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: dev
      PORT: 3200
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 30
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: microservice
      DB_SSL_MODE: disable
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD", "/microservice", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - eventflow-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: eventflow-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: dev
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 30
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: microservice
      DB_SSL_MODE: disable
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      WORKER_PROCESSING_TIMEOUT_SECONDS: 30
      WORKER_METRICS_PORT: 9090
      RABBITMQ_RETRY_DELAY_MS: 5000
      RABBITMQ_MAX_RETRY_DELAY_MS: 60000
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - eventflow-network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  eventflow-network:
    driver: bridge
